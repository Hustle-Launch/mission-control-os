name: Ship / Preview Deploy

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ship-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ship:
    name: Build & Deploy Preview to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Workspace Typecheck
        run: bun run typecheck

      - name: Build Web (TanStack Start / Nitro vercel BOA)
        run: bun run build

      - name: Promote BOA to monorepo root
        run: node scripts/vercel-promote-boa.mjs

      - name: Assert Build Output API present
        run: |
          test -d .vercel/output
          test -f .vercel/output/config.json -o -f .vercel/output/nitro.json
          ls -la .vercel/output

      - name: Deploy Prebuilt Preview to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@39.2.6 pull --yes --environment=preview --token=$VERCEL_TOKEN
          npx vercel@39.2.6 deploy --prebuilt --token=$VERCEL_TOKEN
