name: Ship / Deploy (Blacksmith)

on:
  push:
    branches:
      - main
      - fix/*
      - feat/*
      - preview/*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ship:
    name: Build & Deploy to Vercel (Blacksmith)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Determine Deployment Environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "target=production" >> $GITHUB_OUTPUT
            echo "is_prod=true" >> $GITHUB_OUTPUT
          else
            echo "target=preview" >> $GITHUB_OUTPUT
            echo "is_prod=false" >> $GITHUB_OUTPUT
          fi

      - name: Pull Vercel Environment Variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@39.2.6 pull --yes --environment=${{ steps.env.outputs.target }} --token=$VERCEL_TOKEN

      - name: Run Workspace Typecheck
        run: bun run typecheck

      - name: Build Web (TanStack Start / Nitro vercel BOA)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -a
          if [ -f ".vercel/.env.${{ steps.env.outputs.target }}.local" ]; then
            source ".vercel/.env.${{ steps.env.outputs.target }}.local"
          fi
          set +a
          export VERCEL=1
          export VERCEL_ENV=${{ steps.env.outputs.target }}
          export NITRO_PRESET=vercel
          bun run build

      - name: Promote BOA to monorepo root
        run: node scripts/vercel-promote-boa.mjs

      - name: Assert Build Output API present
        run: |
          test -d .vercel/output
          test -f .vercel/output/config.json -o -f .vercel/output/nitro.json
          ls -la .vercel/output

      - name: Deploy Prebuilt to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ steps.env.outputs.is_prod }}" = "true" ]; then
            npx vercel@39.2.6 deploy --prebuilt --prod --token=$VERCEL_TOKEN
          else
            npx vercel@39.2.6 deploy --prebuilt --token=$VERCEL_TOKEN
          fi

